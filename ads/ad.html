<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<title>Ad Creative</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..900&display=block&subset=latin-ext" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; background: #0a0a0a; overflow: hidden; }
  body { font-family: "Inter", sans-serif; color: #fff; -webkit-font-smoothing: antialiased; }
  body.sq, body.sq html { height: 1080px; }

  .ad { position: relative; width: 1080px; height: 1350px; background: #0a0a0a; overflow: hidden; }
  .sq .ad { height: 1080px; }

  /* Photo: Unsplash (free licence), laptop with an online store */
  .photo { position: absolute; left: 0; top: 0; width: 1080px; height: 760px;
    background: url("photo.jpg") no-repeat center 38% / cover; }
  .sq .photo { height: 580px; background-position: center 42%; }
  .photo::after { content: ""; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(10,10,10,0) 45%, rgba(10,10,10,.85) 82%, #0a0a0a 100%); }

  .tag { position: absolute; top: 48px; left: 56px; z-index: 2; background: #fcff00; color: #0a0a0a;
    font-weight: 900; font-size: 34px; letter-spacing: .06em; padding: 14px 26px; border-radius: 999px; }
  .brand { position: absolute; top: 48px; right: 56px; z-index: 2; background: rgba(10,10,10,.82);
    padding: 16px 26px; border-radius: 999px; display: flex; align-items: center; }
  .brand img { height: 40px; width: auto; display: block; }

  .content { position: absolute; left: 56px; right: 56px; bottom: 56px; z-index: 2; display: grid; gap: 26px; }
  .kicker { font-size: 34px; font-weight: 700; line-height: 1.25; color: #dfe4e1; }
  .kicker b { background: linear-gradient(90deg,#4bfe85,#00dbff); -webkit-background-clip: text; background-clip: text; color: transparent; }
  h1 { font-size: 92px; font-weight: 900; line-height: .98; letter-spacing: -0.035em; }
  .sq h1 { font-size: 78px; }
  .chips { display: flex; flex-wrap: wrap; gap: 12px; }
  .chip { font-size: 26px; font-weight: 600; padding: 12px 20px; border-radius: 999px; background: #1a1c1b; border: 1.5px solid #2e3230; color: #e6ebe8; }
  .chip.g { border-color: #5fd5b6; color: #a5e3b9; }
  .cta { display: flex; align-items: center; justify-content: space-between; gap: 20px; background: #fcff00; color: #0a0a0a;
    border-radius: 22px; padding: 26px 32px; }
  .cta span { font-size: 30px; font-weight: 700; }
  .cta b { font-size: 38px; font-weight: 900; letter-spacing: -0.01em; }
  .sq .content { gap: 20px; bottom: 48px; }
  .sq .kicker { font-size: 30px; }
  .sq .chip { font-size: 24px; padding: 10px 18px; }
  .sq .cta { padding: 22px 28px; }
</style>
</head>
<body>
<div class="ad">
  <div class="photo"></div>
  <div class="tag">ANGAJĂM</div>
  <div class="brand"><img src="logo_white.svg" alt="PagePilot"></div>

  <div class="content">
    <p class="kicker">Unul dintre cei mai mari jucători din <b>e-commerce</b> din România angajează</p>
    <h1>Business Development Manager</h1>
    <div class="chips">
      <span class="chip g">SaaS + E-commerce + AI</span>
      <span class="chip">400.000+ comercianți</span>
      <span class="chip g">100% Remote</span>
      <span class="chip">Salariu fix + bonusuri</span>
    </div>
    <div class="cta"><span>Aplică în 15 minute</span><b>job.pagepilot.ai →</b></div>
  </div>
</div>
<script>if (location.hash === "#sq") document.body.classList.add("sq");</script>
</body>
</html>
